<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Booking | BarberDyy</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <style>
        /* --- STYLE KHUSUS HALAMAN HISTORY --- 
           Sisanya ikut dashboard.css agar konsisten 
        */

        /* TABLE CONTAINER */
        .dashboard-content { 
            background: rgba(30, 41, 59, 0.8); /* Glassmorphism */
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden; 
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(12px);
        }

        /* TABLE STYLE */
        .bookings-table {
            width: 100%; border-collapse: collapse;
        }
        
        .bookings-table th, .bookings-table td {
            padding: 20px; text-align: left; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bookings-table th {
            background-color: rgba(15, 23, 42, 0.6); 
            color: #94a3b8; /* Slate-400 */
            font-weight: 600; 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bookings-table td { 
            color: #f8fafc; 
            font-size: 0.95rem; 
            vertical-align: middle;
        }
        
        .bookings-table tr:last-child td { border-bottom: none; }
        .bookings-table tr:hover { background-color: rgba(255,255,255,0.02); }

        /* BADGES STATUS */
        .badge { 
            display: inline-block;
            padding: 6px 14px; 
            border-radius: 50px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-confirmed { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-completed { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-cancelled, .badge-canceled { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

        /* EMPTY STATE */
        .empty-state {
            text-align: center; padding: 80px 20px; color: #64748b;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; color: var(--primary); }
        .empty-state h3 { color: #fff; margin-bottom: 10px; }

        /* BUTTON ACTION */
        .btn-cancel-booking {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .btn-cancel-booking:hover { background: #ef4444; color: white; }

        /* RESPONSIVE TABLE SCROLL */
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span>Barber<span style="color: var(--primary);">Dyy</span></span>
            </a>
            
            <div class="navbar-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="booking.html" class="nav-link">Booking</a>
                <a href="my-bookings.html" class="nav-link active">History</a>
            </div>

            <div class="user-dropdown">
                <div class="dropdown-toggle" onclick="toggleDropdown()">
                    <div class="avatar-initials" id="navAvatar">U</div>
                    <span id="navUserName">User</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="dropdown-menu" id="userMenu">
                    <a href="profile.html" class="dropdown-item">
                        <i class="fas fa-user-cog"></i> Edit Profile
                    </a>
                    <div class="dropdown-item text-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container dashboard">
        
        <div class="dashboard-header" style="justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1 class="page-title">Riwayat Booking</h1>
                <p class="page-subtitle">Pantau status jadwal cukur Anda di sini.</p>
            </div>
            <a href="booking.html" class="btn-primary">
                <i class="fas fa-plus"></i> Booking Baru
            </a>
        </div>

        <div class="dashboard-content">
            <div class="table-responsive">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>Tanggal & Jam</th>
                            <th>Layanan</th>
                            <th>Barber</th>
                            <th>Harga</th>
                            <th>Pembayaran</th> <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <tr>
                            <td colspan="7" style="text-align:center; padding: 50px; color: #94a3b8;">
                                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px; color: var(--primary);"></i>
                                <br>Sedang memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/my-bookings.js"></script>
    
    <script>
        // --- LOGIC USER & NAVBAR ---
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                alert("Silakan login kembali.");
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);
            document.getElementById('navUserName').textContent = user.name.split(' ')[0];

            const avatarUrl = user.profile_pic ? `http://localhost:3000/${user.profile_pic}` : null;
            const initial = user.name.charAt(0).toUpperCase();
            const avatarEl = document.getElementById('navAvatar');

            if (avatarUrl) {
                avatarEl.innerHTML = `<img src="${avatarUrl}" alt="Profile">`;
            } else {
                avatarEl.textContent = initial;
            }
        });

        function toggleDropdown() {
            const menu = document.getElementById('userMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = function(event) {
            if (!event.target.closest('.user-dropdown')) {
                const menu = document.getElementById('userMenu');
                if (menu) menu.style.display = 'none';
            }
        }

        function logout() {
            if(confirm("Yakin ingin keluar?")) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
