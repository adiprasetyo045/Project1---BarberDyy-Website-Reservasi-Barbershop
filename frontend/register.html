<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar | BarberDyy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           REGISTER THEME: DARK LUXURY (MATCHING LOGIN)
           ========================================= */
        :root {
            --bg-body: #0f172a;       /* Slate 900 */
            --bg-card: #1e293b;       /* Slate 800 */
            --primary: #d4af37;       /* Emas */
            --primary-hover: #b89628;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Background Image Konsisten */
            background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('assets/images/barbershop-interior.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 0; /* Tambah padding atas bawah biar card gak kepotong di HP */
        }

        .auth-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.95); /* Glassmorphism Gelap */
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 480px; /* Sedikit lebih lebar untuk register */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        
        .auth-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem; font-weight: 800; color: white; margin-bottom: 5px;
            display: inline-block;
        }
        .auth-logo span { color: var(--primary); }

        .auth-title { display: none; } /* Kita hide title bawaan biar lebih clean */
        
        .auth-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 5px; }

        .form-group { margin-bottom: 20px; }
        
        .form-label { 
            display: block; margin-bottom: 8px; 
            font-weight: 500; font-size: 0.9rem; color: var(--text-main); 
        }

        /* Styling Input Field Baru */
        .input-with-icon { position: relative; }
        
        .form-input {
            width: 100%;
            padding: 12px 15px 12px 45px; /* Padding kiri lebih besar untuk icon */
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
            background-color: rgba(15, 23, 42, 0.8);
        }

        .input-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); transition: 0.3s; font-size: 1.1rem;
        }
        
        .form-input:focus + .input-icon, 
        .input-with-icon:focus-within .input-icon { 
            color: var(--primary); 
        }

        /* Tombol Toggle Password */
        .password-toggle {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; padding: 0; font-size: 1rem; transition: 0.3s;
        }
        .password-toggle:hover { color: var(--primary); }

        /* Styling Tombol Baru */
        .btn-auth {
            width: 100%; padding: 12px;
            background: var(--primary); color: #0f172a;
            border: none; border-radius: 50px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: 0.3s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-auth:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .btn-auth:disabled { background: #475569; cursor: not-allowed; }

        .auth-footer { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; transition: 0.3s; }
        .auth-footer a:hover { color: white; text-decoration: underline; }

        .back-link {
            display: inline-block; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); text-decoration: none;
        }
        .back-link:hover { color: white; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">Barber<span>Dyy</span></div>
                <p class="auth-subtitle">Bergabung untuk layanan cukur premium</p>
            </div>
            
            <form id="registerForm">
                
                <div class="form-group">
                    <label for="name" class="form-label">Nama Lengkap</label>
                    <div class="input-with-icon">
                        <input type="text" id="name" class="form-input" placeholder="Masukkan nama lengkap" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Nomor WhatsApp</label>
                    <div class="input-with-icon">
                        <input type="tel" id="phone" class="form-input" placeholder="08xxxxxxxxxx" required>
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Alamat Email</label>
                    <div class="input-with-icon">
                        <input type="email" id="email" class="form-input" placeholder="contoh@email.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Kata Sandi</label>
                    <div class="input-with-icon">
                        <input type="password" id="password" class="form-input" placeholder="Buat kata sandi" required minlength="6">
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Konfirmasi Sandi</label>
                    <div class="input-with-icon">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Ulangi kata sandi" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-user-plus"></i> Daftar Sekarang
                    </button>
                </div>
                
                <div class="auth-footer">
                    <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
                    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/register.js"></script>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling.nextElementSibling || input.parentElement.querySelector('button'); // Cari tombol
            const icon = button.querySelector('i');
            
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
