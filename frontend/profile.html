<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | BarberDyy</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        body { background-color: #121212; color: #fff; padding-top: 100px; }
        .container-profile { max-width: 600px; margin: 0 auto; padding: 20px; }

        .profile-card {
            background: #1e1e1e; border: 1px solid #333; border-radius: 16px;
            padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Foto Profil Area */
        .avatar-upload { position: relative; width: 120px; height: 120px; margin: 0 auto 30px; }
        
        /* Container ini yang akan diisi gambar oleh JS */
        #avatarContainer { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }

        .avatar-preview {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid #f1c40f; background: #000;
        }
        .avatar-initial {
            width: 100%; height: 100%; border-radius: 50%;
            background: #000; border: 3px solid #f1c40f;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: 700; color: #f1c40f;
        }
        .avatar-edit-icon {
            position: absolute; bottom: 0; right: 0;
            background: #f1c40f; color: #000;
            width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            z-index: 10;
        }
        .avatar-edit-icon:hover { transform: scale(1.1); }

        /* Form Styling */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9rem; }
        .form-control {
            width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444;
            border-radius: 8px; color: #fff; font-size: 1rem;
        }
        .form-control:focus { outline: none; border-color: #f1c40f; }

        .btn-save {
            width: 100%; background: #f1c40f; color: #000;
            padding: 14px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; font-size: 1rem; margin-top: 10px;
        }
        .btn-save:hover { background: #d4af37; }
        
        .btn-back {
            display: block; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.9rem;
        }
        .btn-back:hover { color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar" style="position:fixed; top:0; width:100%; z-index:1000; background:#181818; padding:15px 0;">
        <div class="container" style="display:flex; justify-content:space-between; max-width:1200px; margin:0 auto; padding:0 20px;">
            <a href="index.html" class="logo" style="font-size:1.5rem; font-weight:800; color:#fff; text-decoration:none;">
                Barber<span style="color:#f1c40f;">Dyy</span>
            </a>
        </div>
    </nav>

    <div class="container-profile">
        <div class="profile-card">
            <h2 style="margin-bottom: 30px;">Edit Profile</h2>

            <form id="profileForm">
                <div class="avatar-upload">
                    <div id="avatarContainer">
                        <span class="avatar-initial">U</span> 
                    </div>
                    
                    <input type="file" id="imageUpload" name="profile_pic" accept=".png, .jpg, .jpeg" style="display: none;">
                    <label for="imageUpload" class="avatar-edit-icon">
                        <i class="fas fa-camera"></i>
                    </label>
                </div>

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email (Tidak bisa diubah)</label>
                    <input type="email" id="email" class="form-control" disabled style="opacity:0.6; cursor:not-allowed;">
                </div>
                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="text" id="phone" name="phone" class="form-control">
                </div>
                <div class="form-group">
                    <label>Password Baru (Kosongkan jika tidak ingin mengubah)</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="******">
                </div>

                <button type="submit" class="btn-save">Simpan Perubahan</button>
            </form>

            <a href="dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Kembali ke Dashboard
            </a>
        </div>
    </div>

    <script src="assets/js/utils.js"></script> 
    <script src="assets/js/profile.js"></script>

</body>
</html>
